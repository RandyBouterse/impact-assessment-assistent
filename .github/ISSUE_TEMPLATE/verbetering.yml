name: Verbetering of ervaring uit de praktijk
description: Het gesprek liep niet goed, of iets kan beter.
labels: ["verbetering"]
body:
  - type: markdown
    attributes:
      value: |
        **Deel nooit persoonsgegevens of vertrouwelijke informatie in een issue.** Een issue is openbaar. Anonimiseer voorbeelden en noem geen namen van mensen, klanten of projecten.
  - type: textarea
    id: wat
    attributes:
      label: Wat ging er mis of wat kan beter?
    validations:
      required: true
  - type: textarea
    id: voorbeeld
    attributes:
      label: Geanonimiseerd voorbeeld van het gesprek (optioneel)
      render: markdown
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Claude
        - Claude Code
        - ChatGPT
        - Microsoft Copilot Studio
        - Gemini
        - Promptversie (Custom GPT, Gem of agent)
        - Anders
  - type: checkboxes
    id: privacy
    attributes:
      label: Controle
      options:
        - label: Er staan geen persoonsgegevens of vertrouwelijke informatie in dit issue.
          required: true
