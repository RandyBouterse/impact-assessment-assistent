<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1050" width="960" height="1050" role="img" aria-labelledby="titel beschrijving">
  <title id="titel">Impact Assessment Assistent: zo werkt het</title>
  <desc id="beschrijving">Vier blokken. 1: het gesprek in zes stappen, van start tot oplevering van een concept. 2: de technische werking, waarin de skill als tekstbestanden draait in de AI-omgeving van de eigen organisatie. 3: aanpassen per organisatie via organisatieprofiel, eigen format, referentiebestanden en testcasussen. 4: de assistent draait in de eigen AI-omgeving en niets gaat naar de maker of naar andere organisaties.</desc>
  <defs>
    <marker id="pijl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f6b"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2433; }
      .titel { font-size: 26px; font-weight: 700; }
      .sub { font-size: 15px; fill: #5b6475; }
      .kop { font-size: 18px; font-weight: 700; fill: #1f6f6b; }
      .nr { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .boxtitel { font-size: 15px; font-weight: 700; }
      .boxtekst { font-size: 13px; fill: #3c4456; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #1f6f6b; }
      .noot { font-size: 14px; fill: #5b6475; }
      .bandtitel { font-size: 19px; font-weight: 700; fill: #134e4a; }
      .bandtekst { font-size: 14.5px; fill: #1d2433; }
      .voet { font-size: 12px; fill: #8a91a0; }
      .box { fill: #f6f8fa; stroke: #d5dbe3; stroke-width: 1.5; }
      .accent { fill: #ffffff; stroke: #1f6f6b; stroke-width: 2.5; }
      .lijn { stroke: #1f6f6b; stroke-width: 2; fill: none; marker-end: url(#pijl); }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="1048" rx="16" fill="#ffffff" stroke="#d5dbe3" stroke-width="2"/>

  <text class="titel" x="40" y="62">Impact Assessment Assistent: zo werkt het</text>
  <text class="sub" x="40" y="90">Een open-source skill die medewerkers vraag voor vraag helpt bij DPIA, IAMA, FRIA en aanvullende toetsen.</text>

  <!-- 1. Gebruiken -->
  <circle cx="52" cy="135" r="13" fill="#1f6f6b"/>
  <text class="nr" x="52" y="140" text-anchor="middle">1</text>
  <text class="kop" x="74" y="141">Zo gebruik je het</text>

  <g text-anchor="middle">
    <rect class="box" x="40" y="160" width="130" height="96" rx="10"/>
    <text class="boxtitel" x="105" y="192">Start</text>
    <text class="boxtekst" x="105" y="216">uitleg en</text>
    <text class="boxtekst" x="105" y="234">3 startvragen</text>

    <rect class="box" x="190" y="160" width="130" height="96" rx="10"/>
    <text class="boxtitel" x="255" y="192">Vertellen</text>
    <text class="boxtekst" x="255" y="216">eigen woorden</text>
    <text class="boxtekst" x="255" y="234">of een document</text>

    <rect class="box" x="340" y="160" width="130" height="96" rx="10"/>
    <text class="boxtitel" x="405" y="192">Triage</text>
    <text class="boxtekst" x="405" y="216">welke toetsen</text>
    <text class="boxtekst" x="405" y="234">zijn nodig?</text>

    <rect class="box" x="490" y="160" width="130" height="96" rx="10"/>
    <text class="boxtitel" x="555" y="192">Verdieping</text>
    <text class="boxtekst" x="555" y="216">alleen de vragen</text>
    <text class="boxtekst" x="555" y="234">die nodig zijn</text>

    <rect class="box" x="640" y="160" width="130" height="96" rx="10"/>
    <text class="boxtitel" x="705" y="192">Risico's</text>
    <text class="boxtekst" x="705" y="216">één tabel met</text>
    <text class="boxtekst" x="705" y="234">maatregelen</text>

    <rect class="accent" x="790" y="160" width="130" height="96" rx="10"/>
    <text class="boxtitel" x="855" y="192">Oplevering</text>
    <text class="boxtekst" x="855" y="216">concept, open</text>
    <text class="boxtekst" x="855" y="234">punten, acties</text>
  </g>
  <path class="lijn" d="M172,208 L187,208"/>
  <path class="lijn" d="M322,208 L337,208"/>
  <path class="lijn" d="M472,208 L487,208"/>
  <path class="lijn" d="M622,208 L637,208"/>
  <path class="lijn" d="M772,208 L787,208"/>

  <text class="noot" x="40" y="290">Tussendoor kan je altijd vragen "wat betekent dit?" of zeggen "weet ik niet". Duur: 15 tot 90 minuten.</text>
  <text class="noot" x="40" y="312">De medewerker bereidt voor. De FG, jurist of privacy officer beoordeelt het concept.</text>

  <!-- 2. Technische werking -->
  <circle cx="52" cy="365" r="13" fill="#1f6f6b"/>
  <text class="nr" x="52" y="370" text-anchor="middle">2</text>
  <text class="kop" x="74" y="371">Technische werking</text>

  <rect class="box" x="40" y="390" width="190" height="130" rx="10"/>
  <text class="boxtitel" x="58" y="420">De skill</text>
  <text class="boxtekst" x="58" y="444">alleen tekstbestanden:</text>
  <text class="boxtekst" x="58" y="463">SKILL.md: regels en fases</text>
  <text class="boxtekst" x="58" y="482">references/: kennis per toets</text>
  <text class="boxtekst" x="58" y="501">organisatie/: jullie profiel</text>

  <rect class="accent" x="270" y="390" width="190" height="130" rx="10"/>
  <text class="boxtitel" x="288" y="420">Jullie AI-omgeving</text>
  <text class="boxtekst" x="288" y="444">Claude, ChatGPT, Copilot</text>
  <text class="boxtekst" x="288" y="463">Studio of Gemini</text>
  <text class="boxtekst" x="288" y="482">zakelijk account, door</text>
  <text class="boxtekst" x="288" y="501">jullie zelf gekozen</text>

  <rect class="box" x="500" y="390" width="190" height="130" rx="10"/>
  <text class="boxtitel" x="518" y="420">Het gesprek</text>
  <text class="boxtekst" x="518" y="444">de medewerker antwoordt</text>
  <text class="boxtekst" x="518" y="463">vraag voor vraag; het model</text>
  <text class="boxtekst" x="518" y="482">laadt alleen de bestanden</text>
  <text class="boxtekst" x="518" y="501">die nodig zijn</text>

  <rect class="box" x="730" y="390" width="190" height="130" rx="10"/>
  <text class="boxtitel" x="748" y="420">Het concept</text>
  <text class="boxtekst" x="748" y="444">assessmentkaart, concept</text>
  <text class="boxtekst" x="748" y="463">per toets, open punten,</text>
  <text class="boxtekst" x="748" y="482">actielijst en samenvatting</text>
  <text class="boxtekst" x="748" y="501">voor de beslisser</text>

  <path class="lijn" d="M232,455 L267,455"/>
  <path class="lijn" d="M462,455 L497,455"/>
  <path class="lijn" d="M692,455 L727,455"/>

  <text class="noot" x="40" y="552">Geen code, geen server, geen database, geen tracking. Het taalmodel leest de instructies en volgt ze.</text>
  <text class="noot" x="40" y="574">Geen ondersteuning voor skills? Gebruik de promptversie in een Custom GPT, Gemini Gem of Copilot-agent.</text>

  <!-- 3. Aanpassen -->
  <circle cx="52" cy="627" r="13" fill="#1f6f6b"/>
  <text class="nr" x="52" y="632" text-anchor="middle">3</text>
  <text class="kop" x="74" y="633">Aanpassen aan je organisatie</text>

  <rect class="box" x="40" y="652" width="205" height="116" rx="10"/>
  <text class="mono" x="58" y="682">organisatieprofiel.md</text>
  <text class="boxtekst" x="58" y="708">contactpunten, eigen</text>
  <text class="boxtekst" x="58" y="727">beleid, al beoordeelde</text>
  <text class="boxtekst" x="58" y="746">tools en leveranciers</text>

  <rect class="box" x="265" y="652" width="205" height="116" rx="10"/>
  <text class="mono" x="283" y="682">eigen-format.md</text>
  <text class="boxtekst" x="283" y="708">jullie DPIA-hoofdstukken</text>
  <text class="boxtekst" x="283" y="727">en risicomatrix, of upload</text>
  <text class="boxtekst" x="283" y="746">het lege format in het gesprek</text>

  <rect class="box" x="490" y="652" width="205" height="116" rx="10"/>
  <text class="mono" x="508" y="682">references/</text>
  <text class="boxtekst" x="508" y="708">vragen, uitleg en wie</text>
  <text class="boxtekst" x="508" y="727">moet meekijken afstemmen</text>
  <text class="boxtekst" x="508" y="746">op jullie sector</text>

  <rect class="box" x="715" y="652" width="205" height="116" rx="10"/>
  <text class="mono" x="733" y="682">tests/</text>
  <text class="boxtekst" x="733" y="708">na elke wijziging de</text>
  <text class="boxtekst" x="733" y="727">tien testcasussen</text>
  <text class="boxtekst" x="733" y="746">doorlopen</text>

  <text class="noot" x="40" y="800">Werk in een eigen kopie (fork of download). Je wijzigingen blijven binnen je organisatie.</text>

  <!-- 4. Privacy -->
  <rect x="40" y="830" width="880" height="166" rx="12" fill="#e7f2ef" stroke="#1f6f6b" stroke-width="2"/>
  <g transform="translate(66,860)">
    <path d="M22,0 L44,8 L44,26 C44,42 34,52 22,58 C10,52 0,42 0,26 L0,8 Z" fill="#1f6f6b"/>
    <path d="M12,29 L19,36 L33,21" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="bandtitel" x="130" y="872">Draait in jullie eigen AI-omgeving. Niets komt bij de maker.</text>
  <text class="bandtekst" x="130" y="902">Er is geen server, account of datakoppeling van de maker. Gesprekken, antwoorden en</text>
  <text class="bandtekst" x="130" y="924">uploads gaan niet naar Randy Bouterse en niet naar andere organisaties die de assistent gebruiken.</text>
  <text class="bandtekst" x="130" y="946">Alleen de AI-dienst die jullie zelf kiezen, verwerkt het gesprek. Gebruik daarom een goedgekeurd</text>
  <text class="bandtekst" x="130" y="968">zakelijk account waarbij jullie gegevens niet worden gebruikt om modellen te trainen.</text>

  <text class="voet" x="40" y="1026">Impact Assessment Assistent door Randy Bouterse, CC BY 4.0. Het resultaat is altijd een concept, geen juridisch oordeel.</text>
</svg>
